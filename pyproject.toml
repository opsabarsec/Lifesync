[project]
name = "lifesync"
version = "0.1.0"
description = "Personal, single-user, Telegram-controlled multi-agent assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifesync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live"'
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: opt-in real-provider smoke tests (read-only; require credentials)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "S"]

[tool.mypy]
python_version = "3.11"
packages = ["lifesync"]
mypy_path = "src"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
